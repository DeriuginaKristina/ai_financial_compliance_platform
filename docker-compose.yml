services:
  backend:
    build: ./backend
    container_name: ai-compliance-backend
    ports:
      - "8080:8080"
    environment:
      APP_SECURITY_USERNAME: accountant
      APP_SECURITY_PASSWORD: change-me
      TOKENIZATION_SECRET: change-me-in-real-deployment
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama
    networks: [fintech-network]
  frontend:
    build: ./frontend
    container_name: ai-compliance-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on: [backend]
    networks: [fintech-network]
  ollama:
    image: ollama/ollama:latest
    container_name: compliance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [fintech-network]
networks:
  fintech-network:
    driver: bridge
volumes:
  ollama-data:
